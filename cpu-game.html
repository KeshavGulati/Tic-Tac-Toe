<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="./assets/tic-tac-toe-new.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./game.css">
  <script src="./cpu-game.js" type="module" defer></script>
  
  <title>Frontend Mentor | Tic Tac Toe</title>
</head>
<body>
    <div class="o-win-div">
        <span class="o-win-text color-silver"></span>
        <h1 class="flex items-center content-center">
            <i class="o-mark fa-sharp fa-solid fa-o"></i>
            <span>TAKES THE ROUND</span>
        </h1>
        <div class="win-btn-div">
            <a href="./index.html" class="quit-btn">QUIT</a>
            <a href="#" class="next-round-btn">NEXT ROUND</a>
        </div>
    </div>
    <div class="x-win-div">
        <!-- <span class="minimize">-</span> -->
        <span class="x-win-text color-silver">YOU WIN</span>
        <h1 class="flex items-center content-center">
            <i class="x-mark fa-sharp fa-solid fa-xmark"></i>
            <span>TAKES THE ROUND</span>
        </h1>
        <div class="win-btn-div">
            <a href="./index.html" class="quit-btn">QUIT</a>
            <a href="#" class="next-round-btn restart-btn">NEXT ROUND</a>
        </div>
    </div>
    <div class="tied-div">
        <!-- <span class="minimize">-</span> -->
        <h1 class="color-silver">ROUND TIED</h1>
        <div class="win-btn-div">
            <a href="./index.html" class="quit-btn">QUIT</a>
            <a href="#" class="next-round-btn restart-btn">NEXT ROUND</a>
        </div>
    </div>
    <div class="main-container">
        <div class="main-container__div icon-div">
            <i class="x-mark fa-sharp fa-solid fa-xmark"></i>
            <i class="o-mark fa-sharp fa-solid fa-o"></i>
        </div>
        <div class="main-container__div turn-div">
            <i class="x-mark fa-sharp fa-solid fa-xmark"></i>
            <b>Turn</b>
        </div>
        <div class="main-container__div restart-div restart-btn" id="restart-btn">
            <div class="restart-div__arrow-div restart-btn">
                <i class="arrow-icon fa-solid fa-arrow-rotate-right restart-btn"></i>
            </div>
        </div>
        <div class="main-container__div boxes-parent">
            <div class="main-container__div box-div box1"></div>
            <div class="main-container__div box-div box2"></div>
            <div class="main-container__div box-div box3"></div>
            <div class="main-container__div box-div box4"></div>
            <div class="main-container__div box-div box5"></div>
            <div class="main-container__div box-div box6"></div>
            <div class="main-container__div box-div box7"></div>
            <div class="main-container__div box-div box8"></div>
            <div class="main-container__div box-div box9"></div>
        </div>
        <div class="main-container__div you-score-div">
            <p>X<span class="x-player"></span></p>
            <span class="x-score">0</span>
        </div>
        <div class="main-container__div ties-div">
            <p>Ties</p>
            <span class="ties">0</span>
        </div>
        <div class="main-container__div cpu-score-div">
            <p>O<span class="o-player"></span></p>
            <span class="o-score">0</span>
        </div>
    </div>
</body>
